name: probe

# Diagnostic only: fetches the given URLs and publishes the raw responses as probe.json.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to fetch
        required: true
      max_bytes:
        description: Bytes kept per response (default 20000, max 2000000)
        required: false
        default: "20000"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: python -m pipeline.probe
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_URLS: ${{ inputs.urls }}
          PROBE_MAX_BYTES: ${{ inputs.max_bytes }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
