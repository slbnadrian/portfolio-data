name: weekly

# Saturday 09:17 UTC: after the SEC rebuilds its nightly bulk files (~3am ET).
on:
  schedule:
    - cron: "17 9 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -q tests
      - name: Build and publish
        run: python -m pipeline.build_weekly
        env:
          GH_TOKEN: ${{ github.token }}
          # A secret, not a variable: GitHub prints variables in the job log, which is public here.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      # GitHub switches off scheduled workflows in a repo with no commits for 60 days.
      # Committing the manifest every week keeps both schedules alive.
      - name: Commit manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json || true
          git commit -m "data: manifest $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push failed"
