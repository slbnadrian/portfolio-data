name: daily

# Weekday evenings, after US after-hours trading ends (01:23 UTC = 9:23pm EDT / 8:23pm EST).
# Off-the-hour on purpose: GitHub delays jobs scheduled exactly on the hour.
on:
  schedule:
    - cron: "23 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -q tests
      - name: Build and publish
        run: python -m pipeline.build_daily
        env:
          GH_TOKEN: ${{ github.token }}
